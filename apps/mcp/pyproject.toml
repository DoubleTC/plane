[project]
name = "bananaz-mcp"
version = "0.1.0"
description = "BananaZ MCP server: Plane's official MCP server adapted to BananaZ (Community Edition + Phases)"
readme = "README.md"
requires-python = ">=3.12"
# Pinned: the compatibility layer relies on this release's tool catalogue and SDK models.
# Bump deliberately and re-run the tests (they fail loudly when upstream internals move).
dependencies = ["plane-mcp-server==0.3.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "responses==0.25.8", "ruff==0.9.7"]

[project.scripts]
bananaz-mcp = "bananaz_mcp.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bananaz_mcp"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
